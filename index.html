<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 股票戰情室 - 機構深度透視版</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { 
            --bg-dark: #020617; --panel-bg: #0a1128; --border-color: #1e3a8a; 
            --text-main: #e2e8f0; --text-muted: #94a3b8; 
            --blue: #3b82f6; --cyan: #06b6d4; --red: #ef4444; --green: #10b981; --orange: #f59e0b; 
            --ma5: #fde047; --ma20: #f43f5e; --purple: #8b5cf6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 6px; height: 100vh; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: var(--bg-dark); } ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

        .top-bar { flex: 0 0 42px; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 0 12px; border-radius: 4px; border: 1px solid var(--border-color); margin-bottom: 6px; }
        .search-group { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { padding: 4px 10px; background: #020617; border: 1px solid var(--border-color); color: white; border-radius: 4px; width: 70px; font-weight: bold; }
        button { padding: 4px 12px; border: none; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; color: white; }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); } .btn-radar { background: #7c3aed; } .btn-sector { background: #059669; }

        .price-zone { display: none; align-items: center; gap: 10px; }
        .current-price { font-size: 24px; font-weight: bold; }
        
        .main-grid { flex: 1; display: grid; grid-template-columns: 14fr 10fr 12fr; gap: 8px; overflow: hidden; display: none; }
        .column { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 2px; }
        
        .chart-wrapper { background: var(--panel-bg); padding: 4px; border-radius: 4px; border: 1px solid var(--border-color); flex:1;}
        #mainChart { height: 450px; } #kdChart { height: 110px; }
        
        .info-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px 10px; }
        .card-header { font-size: 12px; font-weight: bold; color: var(--cyan); border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-bottom: 6px; }

        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .hub-item { background: #020617; border: 1px solid #1e293b; padding: 6px 8px; border-radius: 4px; }
        .hub-lbl { font-size: 10px; color: var(--text-muted); border-bottom: 1px solid #0f172a; margin-bottom: 4px; display:block;}
        .hub-val { font-size: 12px; font-weight: bold; color: white; line-height: 1.4; }
        .hub-wide { grid-column: span 2; }

        .viz-box { background: #020617; border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; display: flex; flex-direction: column; align-items: center; position: relative; flex:1;}
        .gauge-arc { width: 100px; height: 50px; border-radius: 100px 100px 0 0; background: conic-gradient(from 270deg, var(--red) 0% 50%, var(--green) 50% 100%); position: relative; margin-top: 10px; }
        .gauge-arc::after { content: ''; position: absolute; bottom: 0; left: 15px; width: 70px; height: 35px; background: #020617; border-radius: 70px 70px 0 0; }
        .gauge-needle { position: absolute; bottom: 0; left: 50%; width: 2px; height: 45px; background: white; transform-origin: bottom center; transform: rotate(-90deg); transition: 1s; }
        .gauge-text { position: absolute; bottom: 2px; font-size: 16px; font-weight: bold; }
        
        .donut-chart { width: 60px; height: 60px; border-radius: 50%; background: #1e293b; position: relative; display: flex; justify-content: center; align-items: center; margin-top: 10px;}
        .donut-inner { width: 38px; height: 38px; border-radius: 50%; background: #020617; position: absolute; font-size: 9px; display: flex; align-items: center; justify-content: center; }

        /* === 全新：情報快鏈樣式 === */
        .link-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 5px; }
        .info-link { background: #1e293b; color: var(--cyan); text-decoration: none; font-size: 10px; padding: 6px; text-align: center; border-radius: 3px; font-weight: bold; transition: 0.2s; border: 1px solid transparent;}
        .info-link:hover { background: var(--cyan); color: #000; border-color: white;}

        .alert-box { border: 1px dashed var(--orange); background: rgba(245,158,11,0.05); padding: 8px; text-align: center; border-radius: 4px; margin-bottom: 6px;}
        .danger { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.1); }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="search-group">
            <button class="btn-radar" onclick="startRadar()">📡 雷達</button>
            <button class="btn-sector" onclick="startSectors()">🗂️ 板塊</button>
            <input type="text" id="symbol" value="2330" placeholder="代碼">
            <button class="btn-primary" id="analyzeBtn" onclick="analyze()">⚡ 啟動機構終端</button>
        </div>
        <div id="sysMessage" style="font-size:12px; color:var(--cyan); font-weight:bold;"></div>
        <div class="price-zone" id="priceZone">
            <span id="stockTitle" style="font-weight:bold; font-size:18px; color:white;">--</span>
            <span id="ai-signal-badge" style="font-size:11px; padding:2px 6px; border-radius:4px; background:rgba(255,255,255,0.1);">--</span>
            <div class="current-price" id="priceDisplay">0.00</div>
        </div>
    </div>
    
    <div class="main-grid" id="mainGrid">
        <div class="column">
            <div class="chart-wrapper">
                <div class="chart-box"><div class="chart-title">技術面分析 (日K線)</div><div id="mainChart"></div></div>
                <div class="chart-box" style="border:none;"><div id="kdChart"></div></div>
            </div>
            <div class="info-card" style="margin-top:2px; padding:8px;">
                <div style="display:flex; justify-content:space-between; font-size:12px;">
                    <span>大盤漲跌: <b id="taiex-chg">--%</b></span>
                    <span>個股對比: <b id="alpha-strength" style="color:var(--cyan)">--</b></span>
                </div>
            </div>
        </div>
        
        <div class="column">
            <div class="alert-box" id="alertBox">
                <div style="font-size:14px; font-weight:bold;" id="alertTitle">安全</div>
                <div style="font-size:11px;" id="alertMsg">量價結構目前穩定</div>
            </div>

            <div class="info-card" style="flex:1;">
                <div class="card-header">🔱 AI 戰術指揮中樞</div>
                <div class="hub-grid" id="hub-content">
                    <div class="hub-item hub-wide"><span class="hub-lbl">1. 操作建議 (短線)</span><span class="hub-val" id="h-op">--</span></div>
                    <div class="hub-item"><span class="hub-lbl">2. 量價背離判斷</span><span class="hub-val" id="h-vol-div">--</span></div>
                    <div class="hub-item"><span class="hub-lbl">3. 進場勝率</span><span class="hub-val" id="h-win">--</span></div>
                    <div class="hub-item hub-wide"><span class="hub-lbl">4. 中長線看法</span><span class="hub-val" id="h-long">--</span></div>
                    <div class="hub-item"><span class="hub-lbl">5. 成交量分析</span><span class="hub-val" id="h-vol-an">--</span></div>
                    <div class="hub-item"><span class="hub-lbl">6. 主力出貨警示</span><span class="hub-val" id="h-exit">--</span></div>
                    <div class="hub-item hub-wide"><span class="hub-lbl">7. 關鍵價位 (支撐/壓力)</span><span class="hub-val" id="h-levels" style="color:var(--orange);">--</span></div>
                    <div class="hub-item hub-wide" style="border-color:var(--red);"><span class="hub-lbl" style="color:var(--red);">8. 風險提醒</span><span class="hub-val" id="h-risk">--</span></div>
                </div>
            </div>
        </div>

        <div class="column">
            <div style="display:flex; gap:6px;">
                <div class="viz-box">
                    <div style="font-size:10px; font-weight:bold; color:var(--red);">勝率評估</div>
                    <div class="gauge-container"><div class="gauge-arc"></div><div class="gauge-needle" id="gaugeNeedle"></div><div class="gauge-text" id="gaugeText">0%</div></div>
                </div>
                <div class="viz-box">
                    <div style="font-size:10px; font-weight:bold; color:var(--cyan);">明日機率</div>
                    <div class="donut-chart" id="donutChart"><div class="donut-inner">AI</div></div>
                    <div style="font-size:9px; margin-top:8px;"><span id="p-up">漲--%</span> | <span id="p-down">跌--%</span></div>
                </div>
            </div>

            <div class="info-card" style="border-color: var(--purple); flex: 1;">
                <div class="card-header" style="color: var(--purple);">🏰 機構級商業護城河透視</div>
                <div style="background:#020617; border:1px solid var(--purple); padding:8px; border-radius:4px; margin-bottom:6px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:11px; color:var(--purple); font-weight:bold;">護城河評分</span>
                        <span style="font-size:16px; font-weight:bold;" id="moat-score">--</span>
                    </div>
                </div>
                <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">市場目前炒作敘事 (已定價)：</div>
                <div style="font-size:12px; color:white; line-height:1.4; background:rgba(255,255,255,0.05); padding:8px; border-radius:4px;" id="narrative">--</div>
                
                <div style="margin-top:10px; border-top:1px dashed #1e293b; padding-top:10px;">
                    <div style="font-size:11px; color:var(--cyan); font-weight:bold; margin-bottom:4px;">牛熊預測：<span id="bull-bear" style="color:white;">--</span></div>
                    <div style="font-size:10px; color:var(--text-muted);">產業鏈：<span id="industry" style="color:white;">--</span></div>
                </div>

                <div style="margin-top:15px; border-top:2px solid #1e293b; padding-top:10px;">
                    <div style="font-size:11px; font-weight:bold; color:var(--orange); margin-bottom:6px;">🔍 深度情報快鏈 (直達直查)</div>
                    <div class="link-grid" id="infoLinks">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let charts = {}; let currentAnalysis = { symbol: '', price: 0 };
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        async function analyze() {
            const sym = document.getElementById('symbol').value.trim();
            const symbol = /^\d+$/.test(sym) ? sym + ".TW" : sym;
            const btn = document.getElementById('analyzeBtn');
            const msg = document.getElementById('sysMessage');
            document.getElementById('mainGrid').style.display = "none"; document.getElementById('priceZone').style.display = "none";
            btn.disabled = true; msg.innerText = '🔄 避險基金級別深層解析中...';
            
            try {
                const res = await fetch(`https://my-ai-stock-tool.onrender.com/predict?symbol=${symbol}`);
                const data = await res.json();
                if(data.status === "success") {
                    msg.innerText = "";
                    currentAnalysis.symbol = data.symbol; currentAnalysis.price = data.current_price;
                    document.getElementById('mainGrid').style.display = "grid"; document.getElementById('priceZone').style.display = "flex";
                    
                    const pure = data.symbol.split('.')[0];
                    document.getElementById('stockTitle').innerText = pure;
                    document.getElementById('priceDisplay').innerText = data.current_price.toFixed(2);
                    
                    // 更新 Alpha 與 大盤
                    document.getElementById('taiex-chg').innerText = data.alpha.taiex + "%";
                    document.getElementById('alpha-strength').innerText = data.alpha.strength;
                    
                    // 更新情報快鏈
                    document.getElementById('infoLinks').innerHTML = `
                        <a href="https://statementdog.com/analysis/${pure}" target="_blank" class="info-link">財報狗</a>
                        <a href="https://news.cnyes.com/stock/${pure}" target="_blank" class="info-link">鉅亨快訊</a>
                        <a href="https://www.moneydj.com/KMDJ/Wiki/WikiViewer.aspx?KeyID=${pure}" target="_blank" class="info-link">MoneyDJ</a>
                        <a href="https://vime.arklab.cc/stock/${pure}" target="_blank" class="info-link">方舟運算</a>
                        <a href="https://www.stockfeel.com.tw/?s=${pure}" target="_blank" class="info-link">股感百科</a>
                    `;

                    // AI 指揮中樞
                    const ai = data.ai_analysis;
                    document.getElementById('h-op').innerText = ai.op_short;
                    document.getElementById('h-vol-div').innerText = ai.vol_price_div;
                    document.getElementById('h-win').innerText = ai.entry_winrate;
                    document.getElementById('h-long').innerText = ai.mid_long_view;
                    document.getElementById('h-vol-an').innerText = ai.vol_analysis;
                    document.getElementById('h-exit').innerText = ai.exit_warning;
                    document.getElementById('h-levels').innerText = ai.key_levels;
                    document.getElementById('h-risk').innerText = ai.risk_reminder;
                    
                    document.getElementById('moat-score').innerText = ai.moat_score;
                    document.getElementById('narrative').innerText = ai.market_narrative;
                    document.getElementById('bull-bear').innerText = ai.bull_bear;
                    document.getElementById('industry').innerText = ai.industry_desc;

                    // 警示燈
                    const w = data.warning;
                    const aBox = document.getElementById('alertBox');
                    document.getElementById('alertTitle').innerText = w.title;
                    document.getElementById('alertMsg').innerText = w.msg;
                    aBox.className = w.active ? 'alert-box danger' : 'alert-box';

                    // 儀表板
                    document.getElementById('gaugeText').innerText = ai.prob_up + "%";
                    document.getElementById('gaugeNeedle').style.transform = `rotate(${-90 + (180 * (ai.prob_up/100))}deg)`;
                    document.getElementById('donutChart').style.background = `conic-gradient(var(--red) 0% ${ai.prob_up}%, var(--orange) ${ai.prob_up}% ${ai.prob_up+ai.prob_flat}%, var(--green) ${ai.prob_up+ai.prob_flat}% 100%)`;
                    document.getElementById('p-up').innerText = `漲${ai.prob_up}%`; document.getElementById('p-down').innerText = `跌${ai.prob_down}%`;

                    renderCharts(data);
                }
            } catch(e) { msg.innerText = "請再試一次"; } finally { btn.disabled = false; }
        }

        function renderCharts(data) {
            for (let key in charts) { if (charts[key]) try { charts[key].remove(); } catch(e){} }
            const opt = { layout: { background: '#0a1128', textColor: '#94a3b8' }, grid: { vertLines: { color: '#1e3a8a' }, horzLines: { color: '#1e3a8a' } }, timeScale: { visible: false } };
            charts.main = LightweightCharts.createChart(document.getElementById('mainChart'), { ...opt, height: 450 });
            const candle = charts.main.addCandlestickSeries({ upColor: '#ef4444', downColor: '#10b981', borderVisible: false });
            candle.setData(data.chart_data);
            const bbU = charts.main.addLineSeries({ color: 'rgba(255,255,255,0.2)', lineWidth: 1, lineStyle: 2 });
            bbU.setData(data.chart_data.map(d => ({ time: d.time, value: d.bb_upper })));
            const bbL = charts.main.addLineSeries({ color: 'rgba(255,255,255,0.2)', lineWidth: 1, lineStyle: 2 });
            bbL.setData(data.chart_data.map(d => ({ time: d.time, value: d.bb_lower })));
            
            charts.kd = LightweightCharts.createChart(document.getElementById('kdChart'), { ...opt, height: 110 });
            const ks = charts.kd.addLineSeries({ color: '#3b82f6', lineWidth: 1 });
            ks.setData(data.kd_data.map(d => ({ time: d.time, value: d.k })));
            charts.main.timeScale().fitContent();
        }
    </script>
</body>
</html>
